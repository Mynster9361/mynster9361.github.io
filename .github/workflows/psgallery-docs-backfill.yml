name: Backfill PowerShell Module Docs

on:
  workflow_dispatch:
    inputs:
      module_id:
        description: "Space/comma-separated module ids to backfill (blank = all modules in modules-manifest.json)"
        type: string
        default: ""
      dry_run:
        description: "List missing versions only, write no files"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "psgallery-docs-sync"
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install PowerShell dependencies
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Force -Scope CurrentUser
          }
          Install-Module platyPS -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: Run PSGallery docs backfill
        shell: pwsh
        run: |
          $moduleIds = "${{ inputs.module_id }}" -split '[,\s]+' | Where-Object { $_ }
          $params = @{
            DryRun     = $${{ inputs.dry_run == true }}
            PrBodyPath = "$env:RUNNER_TEMP/pr-body.md"
          }
          if ($moduleIds) { $params.ModuleId = $moduleIds }
          ./scripts/psgallery-sync/Backfill-Docs.ps1 @params

      - name: Open pull request
        if: ${{ inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(docs): backfill historical PowerShell module doc versions"
          title: "Backfill historical PowerShell module doc versions"
          branch: automation/psgallery-docs-backfill
          body-path: ${{ runner.temp }}/pr-body.md
